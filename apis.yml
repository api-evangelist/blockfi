aid: blockfi
name: BlockFi
description: 'BlockFi was a Jersey City, New Jersey crypto-financial-services company
  founded in 2017 by Zac Prince and Flori Marquez that offered retail and institutional
  clients interest-bearing crypto accounts (the BlockFi Interest Account), USD loans
  collateralized by bitcoin and other digital assets, spot trading, and a bitcoin-rewards
  credit card, growing on a USD 350 million Series D in March 2021 that valued it at
  roughly USD 3 billion. The company filed for Chapter 11 bankruptcy protection in
  November 2022 in the wake of the FTX and Alameda Research collapse, and emerged in
  October 2023 not as an operating business but as a wind-down estate. Its customer
  web platform and mobile apps have been shut down, in-kind crypto distributions are
  administered through Coinbase and cash distributions through Kroll Restructuring
  Administration and Digital Disbursements, and blockfi.com is now a WordPress notice
  site carrying noindex/nofollow and dated estate updates rather than a product. There
  is no operating developer program: api.blockfi.com and every other developer, docs
  and app subdomain no longer resolve in DNS, the company GitHub organization holds
  zero public repositories, and no OpenAPI, GraphQL, AsyncAPI, MCP or agent-card
  document is served from any surviving BlockFi host.'
